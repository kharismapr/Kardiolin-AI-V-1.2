# ============================================================
# Konfigurasi Flask Backend untuk Java FE
# Edit file ini untuk mengubah base URL atau API key.
# JANGAN hardcode di kode Java — selalu ubah di sini.
# ============================================================

# Base URL Flask backend
# Development (lokal)  : http://localhost:5000
# VPS / production     : http://<IP_VPS>:5000  atau  https://api.namadomain.com
flask.base_url=http://localhost:5000

# API key — harus sama persis dengan FLASK_API_KEY di file .env Flask
flask.api_key=ecg-kardiolin-secret-2026

# Timeout (milidetik)
flask.connect_timeout_ms=5000
flask.read_timeout_ms=15000
